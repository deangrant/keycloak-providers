name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.keycloak-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: test-${{ github.workflow }}-${{ github.ref }}-${{ matrix.keycloak-version }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        keycloak-version:
          - "26.7.1"
          - "26.6.4"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: mvn -B test -Dkeycloak.version=${{ matrix.keycloak-version }}
