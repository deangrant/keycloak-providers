name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.keycloak-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: test-${{ github.workflow }}-${{ github.ref }}-${{ matrix.keycloak-version }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        keycloak-version:
          - "26.7.1"
          - "26.6.4"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: mvn -B test -Dkeycloak.version=${{ matrix.keycloak-version }}
